<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>streamPRO Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.scene{width:100%;height:100%;padding:5%;display:flex;align-items:flex-end;background:radial-gradient(circle at 20% 15%,#212943 0,#0b0d13 40%,#050609 100%)}.panel{width:min(760px,90%);padding:28px 32px;border:1px solid #313848;border-radius:28px;background:#090b10dd;box-shadow:0 24px 100px #0008;backdrop-filter:blur(16px)}.eyebrow{font-size:14px;font-weight:900;letter-spacing:.16em;color:#aeb7ca}.title{font-size:clamp(30px,5vw,68px);font-weight:950;letter-spacing:-.06em;margin:6px 0 24px}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;padding:12px 0;border-bottom:1px solid #222734}.flag{font-size:30px}.country{font-weight:800;font-size:22px}.count{font-weight:950;font-size:26px;font-variant-numeric:tabular-nums}.foot{display:flex;justify-content:space-between;margin-top:20px;color:#7f899d;font-size:13px}
</style>
</head>
<body><div class="scene"><div class="panel"><div class="eyebrow">STREAMPRO · LIVE CHAT GAME</div><div class="title">WHERE ARE YOU FROM?</div><div id="rows" class="rows"></div><div class="foot"><span id="messages">0 messages</span><span id="last">Waiting for chat…</span></div></div></div>
<script>
const rows=document.getElementById('rows'),messages=document.getElementById('messages'),last=document.getElementById('last');
function draw(g){const list=(g.leaderboard||[]).slice(0,7);rows.innerHTML=list.length?list.map((x,i)=>`<div class="row"><div>${i+1}</div><div><span class="flag">${x.flag}</span> <span class="country">${x.name}</span></div><div class="count">${x.count.toLocaleString()}</div></div>`).join(''):'<div class="row"><div>—</div><div class="country">Write your country in chat</div><div>+1</div></div>';messages.textContent=`${g.totalMessages||0} messages`;if(g.lastAccepted)last.textContent=`${g.lastAccepted.flag} ${g.lastAccepted.country} +1`}
async function pull(){try{const r=await fetch('/api/state');const s=await r.json();draw(s.game)}catch{}}pull();setInterval(pull,1000);
</script></body></html>
