<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>streamPRO · Public View</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#fff;background:#05060a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#22283c,#07080d 55%,#030407);display:grid;place-items:center}.wrap{width:min(1200px,94vw)}.scene{position:relative;aspect-ratio:16/9;border:1px solid #2a3040;border-radius:26px;overflow:hidden;background:#090c12;box-shadow:0 30px 100px #0008}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 10%,#27304a99,transparent 40%),radial-gradient(circle at 80% 80%,#161b2b88,transparent 35%)}.top{position:absolute;left:6%;right:6%;top:7%;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#9ea8bf;font-weight:800}.title{font-size:clamp(34px,5vw,78px);font-weight:950;letter-spacing:-.06em;margin-top:12px}.board{position:absolute;left:6%;right:6%;top:32%;bottom:10%;display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#0d1119db;border:1px solid #303748;border-radius:24px;padding:24px;backdrop-filter:blur(12px)}.panel h2{margin:0 0 14px;font-size:14px;letter-spacing:.08em}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #202633}.name{display:flex;gap:10px;align-items:center;font-weight:800}.count{font-size:20px;font-weight:950}.chat{height:100%;overflow:hidden}.msg{padding:10px 0;border-bottom:1px solid #202633}.msg b{font-size:12px}.msg span{display:block;color:#9aa3b4;font-size:12px;margin-top:3px}.empty{color:#777f91}.live{position:fixed;right:24px;top:20px;padding:9px 13px;border-radius:999px;border:1px solid #315c43;background:#0b1d13;color:#baffd0;font-weight:900;font-size:12px}.round{font-size:12px;color:#8e98ac;margin-top:8px}@media(max-width:800px){.board{grid-template-columns:1fr}.panel:nth-child(2){display:none}.scene{border-radius:18px}.panel{padding:18px}}
  </style>
</head>
<body>
  <div class="live">● STREAMPRO LIVE</div>
  <main class="wrap">
    <section class="scene">
      <div class="top"><div><div class="eyebrow">streamPRO · live chat game</div><div class="title">WHERE ARE YOU FROM?</div><div id="round" class="round">Round 1</div></div></div>
      <div class="board">
        <div class="panel"><h2>COUNTRY RANKING</h2><div id="countries"><div class="empty">Waiting for chat…</div></div></div>
        <div class="panel"><h2>LIVE CHAT</h2><div id="chat" class="chat"><div class="empty">Waiting for messages…</div></div></div>
      </div>
    </section>
  </main>
<script src="./config.js"></script>
<script>
const API_BASE=String(window.STREAMPRO_CONFIG?.API_BASE||'').replace(/\/$/,'');const api=p=>API_BASE+p;$('chat');function $(id){return document.getElementById(id)}
const feed=[];const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));
function render(s){const rows=s?.game?.leaderboard||[];$('round').textContent=`Round ${s?.game?.round||1} · ${s?.game?.totalMessages||0} messages`;$('countries').innerHTML=rows.length?rows.slice(0,10).map(x=>`<div class="row"><div class="name"><span>${esc(x.flag||'🌐')}</span><span>${esc(x.name)}</span></div><div class="count">${Number(x.count).toLocaleString()}</div></div>`).join(''):'<div class="empty">Waiting for chat…</div>'}
async function refresh(){try{const r=await fetch(api('/api/state'));if(r.ok)render(await r.json())}catch{}}
function connect(){if(!API_BASE)return;const u=new URL(API_BASE);u.protocol=u.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(u.toString());ws.onmessage=e=>{const p=JSON.parse(e.data);if(p.type==='state'||p.type==='game:update')render(p.data||p);if(p.type==='chat:message'){feed.unshift(p.data);feed.splice(12);$('chat').innerHTML=feed.map(x=>`<div class="msg"><b>${esc(x.author||'viewer')}</b><span>${esc(x.message)}</span></div>`).join('')}};ws.onclose=()=>setTimeout(connect,2500)}connect();refresh();setInterval(refresh,5000);
</script>
</body>
</html>
