services:
  - type: web
    name: streampro-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: CHAT_POLL
        value: "true"
      - key: STUDIO_TOKEN
        sync: false
