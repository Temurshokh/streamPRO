services:
  - type: web
    name: streampro-api
    runtime: node
    plan: free
    buildCommand: apt-get update && apt-get install -y ffmpeg && npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: CHAT_POLL
        value: "true"
